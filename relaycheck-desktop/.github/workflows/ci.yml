name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go:
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Go vet
        run: go vet -mod=vendor ./ ./internal/...
      - name: Go test
        run: go test -mod=vendor -count=1 ./ ./internal/...
      - name: Core coverage floor 55%
        shell: pwsh
        run: |
          go test -mod=vendor -count=1 -coverprofile=core-cover.out ./internal/core/
          $core = go tool cover -func=core-cover.out | Select-String -Pattern '^total:'
          if (-not $core) { throw "no total coverage line" }
          if ($core.Line -notmatch '(\d+\.\d+)%') { throw "cannot parse core coverage: $($core.Line)" }
          $corePct = [double]$Matches[1]
          Write-Host "internal/core coverage: $corePct%"
          if ($corePct -lt 55.0) { throw "core coverage $corePct% < 55%" }
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./ ./internal/...

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: error
